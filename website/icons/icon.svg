<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing background circle -->
  <circle cx="256" cy="256" r="160" fill="#10B981" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Center Hexagon / Sensor Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="16 8"/>
  
  <!-- Leaf and Hydraulic Water Droplet Path -->
  <path d="M256 120 C 330 150 370 230 350 310 C 335 370 280 400 256 400 C 232 400 177 370 162 310 C 142 230 182 150 256 120 Z" fill="url(#emeraldGrad)"/>
  
  <!-- Inner Leaf Vein / Water Channel -->
  <path d="M256 150 L256 360" stroke="#020617" stroke-width="10" stroke-linecap="round"/>
  <path d="M256 220 C280 200 300 210 320 220" stroke="#020617" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M256 270 C232 250 212 260 192 270" stroke="#020617" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M256 310 C280 295 295 305 310 310" stroke="#020617" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Cyan Water Pulse Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 12"/>
</svg>
