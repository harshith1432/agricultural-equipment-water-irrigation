<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sunSpot" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#4ade80" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="leafGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="60%" stop-color="#166534" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#021408" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rich Soil Base -->
  <rect width="200" height="200" rx="24" fill="#0f2617" />
  
  <!-- Underlayer Dark Foliage -->
  <g opacity="0.6" filter="url(#leafShadow)">
    <path d="M 40,160 Q 20,100 80,70 Q 110,120 40,160 Z" fill="#0d3b1f" />
    <path d="M 160,150 Q 180,90 120,60 Q 90,110 160,150 Z" fill="#0b321a" />
    <path d="M 30,70 Q 70,30 110,60 Q 80,100 30,70 Z" fill="#144626" />
  </g>

  <!-- Midlayer Leaf Stems -->
  <path d="M 100,190 Q 98,120 90,60" stroke="#166534" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <path d="M 95,130 Q 55,115 35,110" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 96,110 Q 140,95 165,90" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 92,80 Q 60,65 45,55" stroke="#166534" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 92,70 Q 130,55 150,45" stroke="#166534" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Main Primary Potato Foliage Leaves (Compound Leaflets) -->
  <!-- Left Lower Leaf -->
  <path d="M 35,110 Q 10,85 45,60 Q 75,85 35,110 Z" fill="url(#leafGrad2)" filter="url(#leafShadow)" />
  <path d="M 35,110 Q 28,85 45,60" stroke="#bbf7d0" stroke-width="1.2" fill="none" opacity="0.7" />

  <!-- Right Lower Leaf -->
  <path d="M 165,90 Q 190,65 155,40 Q 125,65 165,90 Z" fill="url(#leafGrad1)" filter="url(#leafShadow)" />
  <path d="M 165,90 Q 160,65 155,40" stroke="#bbf7d0" stroke-width="1.2" fill="none" opacity="0.7" />

  <!-- Left Upper Leaflet -->
  <path d="M 45,55 Q 30,30 65,15 Q 90,38 45,55 Z" fill="url(#leafGrad1)" filter="url(#leafShadow)" />
  <path d="M 45,55 Q 48,35 65,15" stroke="#ecfccb" stroke-width="1" fill="none" opacity="0.8" />

  <!-- Right Upper Leaflet -->
  <path d="M 150,45 Q 165,20 130,10 Q 105,30 150,45 Z" fill="url(#leafGrad2)" filter="url(#leafShadow)" />
  <path d="M 150,45 Q 145,28 130,10" stroke="#ecfccb" stroke-width="1" fill="none" opacity="0.8" />

  <!-- Center Terminal Leaflet (Vibrant & Sunny) -->
  <path d="M 90,60 Q 60,20 90,2 Q 120,20 90,60 Z" fill="url(#leafGrad2)" filter="url(#leafShadow)" />
  <path d="M 90,60 Q 90,30 90,2" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.9" />

  <!-- Foreground Lush Broad Leaflet -->
  <path d="M 95,140 Q 45,110 80,75 Q 135,90 95,140 Z" fill="url(#leafGrad1)" filter="url(#leafShadow)" />
  <path d="M 95,140 Q 75,110 80,75" stroke="#bbf7d0" stroke-width="1.5" fill="none" opacity="0.8" />
  <!-- Secondary Leaf Veins -->
  <path d="M 88,125 Q 70,120 60,118" stroke="#86efac" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 82,105 Q 68,100 58,95" stroke="#86efac" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 88,118 Q 105,112 115,108" stroke="#86efac" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Dew Drops on Leaf Surface -->
  <circle cx="85" cy="85" r="3" fill="#ffffff" opacity="0.85" />
  <circle cx="84" cy="84" r="1.2" fill="#ffffff" />
  
  <circle cx="140" cy="50" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="55" cy="45" r="2" fill="#ffffff" opacity="0.8" />

  <!-- Sunlight Glow Overlay -->
  <circle cx="60" cy="50" r="110" fill="url(#sunSpot)" pointer-events="none" />
</svg>
