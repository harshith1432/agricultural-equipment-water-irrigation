services:
  - type: web
    name: agricultural-equipment-water-irrigation
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: ENTERPRISE_API_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: water-irrigation-system-8aeeb
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        value: water-irrigation-system-8aeeb.firebaseapp.com
      - key: FIREBASE_STORAGE_BUCKET
        value: water-irrigation-system-8aeeb.firebasestorage.app
      - key: CORS_ORIGIN
        value: "*"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_SECRET
        sync: false
      - key: VITE_GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
